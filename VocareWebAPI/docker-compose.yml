services:
  vocare-db:
    image: pgvector/pgvector:pg16
    container_name: vocare-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vocare
    ports:
      - "5434:5432"
    volumes:
      - vocare_data:/var/lib/postgresql/data

volumes:
  vocare_data:
